<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova Particle Background</title>
<style>
  /* ---- Widget container styles. Do not edit unless you know what you're doing. ---- */
  html, body { margin: 0; height: 100%; }
  #nova-bg {
    position: fixed;   /* fills the viewport and sits behind page content   */
    inset: 0;          /* top/right/bottom/left: 0                          */
    z-index: -1;       /* behind everything; raise/remove to bring forward  */
    overflow: hidden;
    background: #160016;
  }
  #nova-bg canvas { display: block; }
</style>
</head>
<body>

  <!-- ================= NOVA PARTICLE BACKGROUND WIDGET ================= -->
  <!-- Mount point. The canvas is injected here automatically.            -->
  <div id="nova-bg"></div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.136.0";
    import { OrbitControls } from "https://esm.sh/three@0.136.0/examples/jsm/controls/OrbitControls";

    /* ============================================================
       ▼▼▼  MODIFIABLE VARIABLES — EDIT ONLY WHAT IS IN HERE  ▼▼▼
       Everything below this block is the engine. Leave it alone.
       ============================================================ */
    const CONFIG = {
      // Where the background mounts. Use the id/selector of the container div.
      mountSelector: "#nova-bg",

      // Scene background color (hex). Matches the deep plum in the reference.
      backgroundColor: 0x160016,

      // Particle gradient. Inner = warm gold core, outer = purple rim.
      colorInner: [227, 155, 0],   // RGB 0–255 (gold)
      colorOuter: [100, 50, 255],  // RGB 0–255 (purple)

      // How many particles. Higher = denser & prettier, but heavier on the GPU.
      coreParticles: 50000,   // the bright spherical "nova" core
      diskParticles: 100000,  // the surrounding flat galactic disk

      // Look & feel
      particleSize: 0.125,    // base point size
      cameraHeight: 4,        // camera Y position
      cameraDistance: 21,     // camera Z position (zoom; larger = further away)
      tilt: 0.2,              // disk tilt in radians

      // Motion
      animationSpeed: 0.5,    // particle shimmer/flow speed
      rotationSpeed: 0.05,    // slow auto-spin of the whole galaxy

      // Interaction: let the visitor drag to orbit the camera.
      enableControls: true,
    };
    /* ============================================================
       ▲▲▲  END OF MODIFIABLE VARIABLES  ▲▲▲
       ============================================================ */


    /* ----------------------------------------------------------------
       Engine — DO NOT MODIFY below this line.
       ---------------------------------------------------------------- */
    const mount = document.querySelector(CONFIG.mountSelector);
    const getW = () => mount.clientWidth || window.innerWidth;
    const getH = () => mount.clientHeight || window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.backgroundColor);

    const camera = new THREE.PerspectiveCamera(60, getW() / getH(), 1, 1000);
    camera.position.set(0, CONFIG.cameraHeight, CONFIG.cameraDistance);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(getW(), getH());
    mount.appendChild(renderer.domElement);

    const resize = () => {
      camera.aspect = getW() / getH();
      camera.updateProjectionMatrix();
      renderer.setSize(getW(), getH());
    };
    window.addEventListener("resize", resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(mount);

    let controls = null;
    if (CONFIG.enableControls) {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
    }

    const gu = { time: { value: 0 } };

    const sizes = [];
    const shift = [];
    const pushShift = () => {
      shift.push(
        Math.random() * Math.PI,
        Math.random() * Math.PI * 2,
        (Math.random() * 0.9 + 0.1) * Math.PI * 0.1,
        Math.random() * 0.9 + 0.1
      );
    };

    const pts = new Array(CONFIG.coreParticles).fill().map(() => {
      sizes.push(Math.random() * 1.5 + 0.5);
      pushShift();
      return new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 0.5 + 9.5);
    });

    for (let i = 0; i < CONFIG.diskParticles; i++) {
      const r = 10, R = 40;
      const rand = Math.pow(Math.random(), 1.5);
      const radius = Math.sqrt(R * R * rand + (1 - rand) * r * r);
      pts.push(new THREE.Vector3().setFromCylindricalCoords(radius, Math.random() * 2 * Math.PI, (Math.random() - 0.5) * 2));
      sizes.push(Math.random() * 1.5 + 0.5);
      pushShift();
    }

    const g = new THREE.BufferGeometry().setFromPoints(pts);
    g.setAttribute("sizes", new THREE.Float32BufferAttribute(sizes, 1));
    g.setAttribute("shift", new THREE.Float32BufferAttribute(shift, 4));

    const ci = CONFIG.colorInner, co = CONFIG.colorOuter;
    const m = new THREE.PointsMaterial({
      size: CONFIG.particleSize,
      transparent: true,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      onBeforeCompile: shader => {
        shader.uniforms.time = gu.time;
        shader.vertexShader = `
          uniform float time;
          attribute float sizes;
          attribute vec4 shift;
          varying vec3 vColor;
          ${shader.vertexShader}
        `.replace(
          `gl_PointSize = size;`,
          `gl_PointSize = size * sizes;`
        ).replace(
          `#include <color_vertex>`,
          `#include <color_vertex>
            float d = length(abs(position) / vec3(40., 10., 40));
            d = clamp(d, 0., 1.);
            vColor = mix(vec3(${ci[0]}., ${ci[1]}., ${ci[2]}.), vec3(${co[0]}., ${co[1]}., ${co[2]}.), d) / 255.;
          `
        ).replace(
          `#include <begin_vertex>`,
          `#include <begin_vertex>
            float t = time;
            float moveT = mod(shift.x + shift.z * t, PI2);
            float moveS = mod(shift.y + shift.z * t, PI2);
            transformed += vec3(cos(moveS) * sin(moveT), cos(moveT), sin(moveS) * sin(moveT)) * shift.w;
          `
        );
        shader.fragmentShader = `
          varying vec3 vColor;
          ${shader.fragmentShader}
        `.replace(
          `#include <clipping_planes_fragment>`,
          `#include <clipping_planes_fragment>
            float d = length(gl_PointCoord.xy - 0.5);
          `
        ).replace(
          `vec4 diffuseColor = vec4( diffuse, opacity );`,
          `vec4 diffuseColor = vec4( vColor, smoothstep(0.5, 0.1, d) );`
        );
      }
    });

    const p = new THREE.Points(g, m);
    p.rotation.order = "ZYX";
    p.rotation.z = CONFIG.tilt;
    scene.add(p);

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      if (controls) controls.update();
      const t = clock.getElapsedTime() * CONFIG.animationSpeed;
      gu.time.value = t * Math.PI;
      p.rotation.y = t * CONFIG.rotationSpeed;
      renderer.render(scene, camera);
    });
  </script>
  <!-- ================= END NOVA PARTICLE BACKGROUND WIDGET ================= -->

</body>
</html>
