<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Create an account — Business Name</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#06060f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%236d5dfc'/%3E%3Crect%20x='9'%20y='9'%20width='14'%20height='14'%20rx='4'%20fill='%2306060f'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
<style>
  body{ min-height:100svh; display:flex; align-items:center; justify-content:center; padding:2rem }
  .authcard{ width:100%; max-width:420px; border-radius:var(--radius); border:1px solid var(--line); background:linear-gradient(180deg,rgba(18,18,42,.82),rgba(10,10,26,.9)); box-shadow:0 30px 80px -30px rgba(0,0,0,.8); backdrop-filter:blur(14px); padding:clamp(1.8rem,4vw,2.6rem) }
  .authcard .brand{ margin-bottom:1.6rem }
  .authcard h1{ font-size:1.7rem; margin-bottom:.4rem }
  .authcard p.sub{ color:var(--muted); font-size:.95rem; margin-bottom:1.8rem }
  .field{ margin-bottom:1.1rem }
  .field label{ display:block; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:.5rem }
  .field input{ width:100%; background:rgba(0,0,0,.35); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:.75rem .9rem; font-size:.98rem; font-family:var(--font-body); transition:border-color .2s }
  .field input:focus{ outline:none; border-color:var(--accent) }
  .field .hint{ color:var(--faint); font-size:.78rem; margin-top:.4rem }
  .authcard .btn{ width:100%; margin-top:.5rem }
  .formmsg{ font-size:.85rem; padding:.7rem .9rem; border-radius:10px; margin-bottom:1.1rem; display:none }
  .formmsg.error{ display:block; color:#ffb4c8; background:rgba(255,72,208,.09); border:1px solid rgba(255,72,208,.3) }
  .authfoot{ margin-top:1.6rem; text-align:center; font-size:.88rem; color:var(--muted) }
  .authfoot a{ color:var(--accent) }
</style>
</head>
<body class="has-livingbg">
<div class="sds-back" role="navigation" aria-label="Return to Surette Systems">
  <a href="../../casestudies.html">&#8592; Back to Surette Systems</a>
</div>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="authcard">
  <a class="brand" href="index.html" id="navBrand"><span class="mark" aria-hidden="true"></span><span id="navBrandText"></span></a>
  <h1>Create an account</h1>
  <p class="sub">Track your quote requests and their status in one place.</p>
  <div class="formmsg" id="formMsg"></div>
  <form id="registerForm" novalidate>
    <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required /></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required /></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required /><div class="hint">At least 8 characters.</div></div>
    <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required /></div>
    <button class="btn btn-primary" type="submit" id="submitBtn"><span>Create account</span></button>
  </form>
  <div class="authfoot">Already have an account? <a href="login.html">Sign in</a></div>
</div>

<script src="siteConfig.js"></script>
<script>
(function(){
  try{ var xhr=new XMLHttpRequest(); xhr.open("GET","/api/config",false); xhr.send(null); if(xhr.status===200){ var remote=JSON.parse(xhr.responseText); if(remote&&remote.business) window.SITE_CONFIG=remote; } }catch(e){}
  var C = window.SITE_CONFIG;
  if(C){
    var letter=(C.business.shortName||C.business.name).charAt(0), rest=(C.business.shortName||C.business.name).slice(1);
    document.getElementById("navBrandText").innerHTML = '<span class="one">'+letter+'</span>'+rest;
    document.title = "Create an account — " + C.business.name;
  }
  var form=document.getElementById("registerForm"), msg=document.getElementById("formMsg"), btn=document.getElementById("submitBtn");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    msg.className="formmsg"; msg.textContent="";
    var name=document.getElementById("name").value.trim();
    var email=document.getElementById("email").value.trim();
    var password=document.getElementById("password").value;
    var confirm=document.getElementById("confirm").value;
    if(password !== confirm){ msg.className="formmsg error"; msg.textContent="Passwords don't match."; return; }
    if(password.length < 8){ msg.className="formmsg error"; msg.textContent="Password must be at least 8 characters."; return; }

    btn.disabled=true; btn.querySelector("span").textContent="Creating account…";
    fetch("/api/auth/register", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name:name, email:email, password:password })
    }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(!res.ok){ msg.className="formmsg error"; msg.textContent=res.data.error||"Could not create account."; btn.disabled=false; btn.querySelector("span").textContent="Create account"; return; }
        window.location.href="account.html";
      }).catch(function(){ msg.className="formmsg error"; msg.textContent="Network error — please try again."; btn.disabled=false; btn.querySelector("span").textContent="Create account"; });
  });
})();
</script>
<script defer src="vendor/three.min.js"></script>
<script defer src="site-bg.js"></script>
</body>
</html>
