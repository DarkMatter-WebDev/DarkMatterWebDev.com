<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Hole Overlay Icon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .scene {
    position: relative;
    width: 640px;
    height: 360px;
    background: radial-gradient(ellipse at center, #0a0010 0%, #000 70%);
    border: 1px solid #111;
    overflow: hidden;
  }

  /* Drop your <video> tag here and remove the .scene background */
  /* <video src="your-blackhole.mp4" autoplay loop muted playsinline></video> */

  .overlay-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    /* transform is driven entirely by JS — do not set transition on it */
    will-change: transform;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <canvas id="bhIcon" class="overlay-icon" width="140" height="140"></canvas>
</div>

<script>
const canvas = document.getElementById('bhIcon');
const scene  = document.getElementById('scene');
const ctx    = canvas.getContext('2d');
const W = 140, H = 140, CX = 70, CY = 70;

let t = 0;

// Physics state — offset from the resting center position
let ox = 0, oy = 0;   // current offset (px)
let vx = 0, vy = 0;   // velocity (px/frame)

// Mouse in viewport coords; null when outside scene
let mouseX = null, mouseY = null;

const ATTRACT_RADIUS   = 100;   // px — how far away to start pulling
const ATTRACT_STRENGTH = 0.055; // acceleration per px of pull force
const SPRING           = 0.045; // return-to-center spring constant
const DAMPING          = 0.78;  // velocity multiplier per frame
const MAX_OFFSET       = 130;   // hard clamp so it stays on screen

scene.addEventListener('mousemove', e => {
  const r = scene.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
scene.addEventListener('mouseleave', () => { mouseX = null; mouseY = null; });

const diskParticles = Array.from({ length: 36 }, (_, i) => ({
  angle:  (i / 36) * Math.PI * 2,
  r:      30 + (i % 3) * 7,
  speed:  -(0.036 + (i % 5) * 0.01),
  size:   0.8 + (i % 4) * 0.55,
  bright: 0.78 + (i % 7) * 0.03,
}));

function drawArcRing(radius, lineWidth, colorFn, segments, gapRad, offset) {
  for (let i = 0; i < segments; i++) {
    const a          = (i / segments) * Math.PI * 2 + offset;
    const brightness = (Math.sin(a * 3 + t * 1.8) + 1) / 2;
    ctx.strokeStyle  = colorFn(brightness);
    ctx.lineWidth    = lineWidth;
    ctx.beginPath();
    ctx.arc(CX, CY, radius, a, a + gapRad);
    ctx.stroke();
  }
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  t += 0.065;

  const pulse = (Math.sin(t * 1.4) + 1) / 2;

  // --- physics update ---
  // Current icon center in scene-local coords
  const sceneCX = scene.offsetWidth  / 2 + ox;
  const sceneCY = scene.offsetHeight / 2 + oy;

  if (mouseX !== null) {
    const dx   = mouseX - sceneCX;
    const dy   = mouseY - sceneCY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < ATTRACT_RADIUS && dist > 1) {
      // Force ramps up sharply as cursor gets closer (inverse falloff)
      const falloff = 1 - dist / ATTRACT_RADIUS;
      const force   = ATTRACT_STRENGTH * falloff * falloff * dist;
      vx += (dx / dist) * force;
      vy += (dy / dist) * force;
    }
  }

  // Spring back toward rest
  vx -= ox * SPRING;
  vy -= oy * SPRING;

  // Damp and integrate
  vx *= DAMPING;
  vy *= DAMPING;
  ox += vx;
  oy += vy;

  // Clamp
  ox = Math.max(-MAX_OFFSET, Math.min(MAX_OFFSET, ox));
  oy = Math.max(-MAX_OFFSET, Math.min(MAX_OFFSET, oy));

  canvas.style.transform = `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px))`;

  // Proximity glow — brighter the closer the cursor
  let glowRadius = 22, glowAlpha = 0.7;
  if (mouseX !== null) {
    const dx   = mouseX - sceneCX;
    const dy   = mouseY - sceneCY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < ATTRACT_RADIUS) {
      const t2 = 1 - dist / ATTRACT_RADIUS;
      glowRadius = 18 + t2 * 28;
      glowAlpha  = 0.45 + t2 * 0.55;
    }
  }
  canvas.style.filter = `drop-shadow(0 0 ${glowRadius}px rgba(255,130,20,${glowAlpha}))`;

  // --- draw ---

  drawArcRing(
    22, 2,
    b => `rgba(${100 + b * 120 | 0}, ${170 + b * 80 | 0}, 255, ${0.5 + b * 0.5})`,
    48, 0.12, t * 1.7
  );

  diskParticles.forEach(p => {
    p.angle += p.speed;
    const px = CX + Math.cos(p.angle) * p.r;
    const py = CY + Math.sin(p.angle) * p.r * 0.32;
    const g  = (Math.sin(p.angle * 2 + t) + 1) / 2;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, ${175 + g * 80 | 0}, ${80 + g * 80 | 0}, ${p.bright})`;
    ctx.fill();
  });

  // event horizon
  ctx.fillStyle = 'rgba(0, 0, 0, 1)';
  ctx.beginPath();
  ctx.arc(CX, CY, 11, 0, Math.PI * 2);
  ctx.fill();

  // photon sphere
  ctx.strokeStyle = 'rgba(255, 150, 40, 0.28)';
  ctx.lineWidth   = 0.8;
  ctx.beginPath();
  ctx.arc(CX, CY, 13, 0, Math.PI * 2);
  ctx.stroke();

  // singularity
  const singSize  = 1.8 + pulse * 1.4;
  const singAlpha = 0.8 + pulse * 0.2;
  ctx.save();
  ctx.shadowColor = `rgba(255, 220, 140, ${singAlpha})`;
  ctx.shadowBlur  = 10 + pulse * 14;
  ctx.fillStyle   = `rgba(255, 240, 200, ${singAlpha})`;
  ctx.beginPath();
  ctx.arc(CX, CY, singSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  requestAnimationFrame(drawFrame);
}

drawFrame();
</script>

</body>
</html>
