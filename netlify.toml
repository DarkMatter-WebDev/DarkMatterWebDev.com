# Static site — no build step. Netlify serves the repo root as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/downloads.html"
  to = "/apps.html"
  status = 301

[[redirects]]
  from = "/es/downloads.html"
  to = "/es/apps.html"
  status = 301
