<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surette Data Systems — Logo Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #04080f;
      font-family: 'Exo 2', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    nav {
      display: flex;
      align-items: center;
      padding: 10px 32px;
      background: #060b18;
      border-bottom: 1px solid rgba(0, 160, 220, 0.12);
    }

    nav ul {
      margin-left: auto;
      display: flex;
      gap: 28px;
      list-style: none;
    }

    nav ul a {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.07em;
      color: rgba(140, 185, 220, 0.45);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav ul a:hover { color: rgba(140, 185, 220, 0.9); }

    /* ── Page content ── */
    .hero {
      max-width: 760px;
      margin: 80px auto 0;
      padding: 0 32px;
    }

    .hero h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ddeeff;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(140, 185, 220, 0.55);
      line-height: 1.7;
      max-width: 520px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: rgba(0, 180, 255, 0.35);
      margin: 28px 0;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <nav>
    <!-- Drop your logo here — just needs id="sds-logo" -->
    <div id="sds-logo"></div>

    <ul>
      <li><a href="#">Services</a></li>
      <li><a href="#">Solutions</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Built for scale.<br>Engineered for precision.</h1>
    <div class="divider"></div>
    <p>
      Surette Data Systems delivers end-to-end software development and
      data architecture solutions — from cloud-native backends to
      intelligent analytics pipelines.
    </p>
  </section>

  <!-- Logo script — place before </body> -->
  <script src="surette-logo.js"></script>

</body>
</html>
